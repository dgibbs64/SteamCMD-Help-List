---
# This workflow generates the output and pushes it to main branch

name: Generate Output

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: ["main"]
  pull_request:
    paths:
      - "steamcmd_help.sh"
      - ".github/workflows/action-generate_output.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup SteamCMD
        uses: CyberAndrii/setup-steamcmd@v1.3.0

      - name: Run steamcmd_help.sh
        run: ./steamcmd_help.sh

      - name: Show changes
        run: git status --short && git diff --stat

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Add and commit changes
        if: github.event_name != 'pull_request'
        uses: EndBug/add-and-commit@v9
        with:
          fetch: false
          message: "GitHub Actions build: ${{ steps.date.outputs.date }}"
          push: true

  # Scheduled workflows are disabled after 60 days without repo activity,
  # and this one only commits when the SteamCMD output changes.
  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1
